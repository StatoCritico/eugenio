[project]
name = "indicatori-ssn"
version = "1.0.0"
description = "EuGEnio, fase 8: indicatori della spesa energetica degli enti del Servizio Sanitario Nazionale"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
prove = ["pytest>=8"]

[project.scripts]
indicatori-ssn = "indicatori_ssn.cli:main"

[tool.setuptools]
packages = ["indicatori_ssn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
