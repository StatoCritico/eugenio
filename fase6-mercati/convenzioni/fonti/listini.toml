# Listini e corrispettivi mensili pubblicati dalle centrali per convenzioni che EuGEnio non calcola: se ne leggono solo i
# prezzi, così come pubblicati, per la pagina Statistiche › Indici dei prezzi e per la newsletter (11/11/2026, Paolo).
# I listini delle convenzioni che hanno un TOML in convenzioni/ stanno nella loro sezione [listino].
#
#   id, serie, centrale, titolo, url
#   formato            «consip» (un foglio per lotto) o «intercenter» (un Excel per lotto)
#   nome               nome della serie nella pagina
#   lotto_predefinito  lotto mostrato all'apertura della pagina e nella newsletter

# Consip, Energia Elettrica 22 (prezzo variabile, 17 lotti), corrispettivi mensili su acquistinretepa.it.
# ATTENZIONE: l'id del documento cambia a ogni mese (questo è «EE22 - Corrispettivi - 1026», ottobre 2026): il file
# contiene tutti i mesi dal novembre 2024, quindi basta aggiornare l'indirizzo con quello del mese nuovo.
[[listino]]
id = "consip-ee22"
centrale = "Consip"
titolo = "Energia Elettrica 22"
nome = "Consip – Energia Elettrica 22, prezzo variabile"
formato = "consip"
lotto_predefinito = "6"
url = "https://www.acquistinretepa.it/downloadservices/getDocument?id=8fdd33af320a1e0e"

