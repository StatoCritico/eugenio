# Pagine delle centrali di committenza controllate ogni notte dalla sorveglianza (mercati_energia/sorveglianza.py),
# oltre a quelle scritte nella sezione [sorveglianza] di ogni convenzione.
#
#   tipo = "elenco"  pagina con l'elenco delle convenzioni o delle gare: si segnalano i collegamenti nuovi il cui
#                    testo contiene una delle `parole` (predefinite: energia elettrica, gas naturale, fornitura di
#                    gas, fornitura di energia). Servono a sapere quando esce una convenzione da aggiungere.
#   tipo = "pagina"  pagina di una gara o convenzione precisa: si segnalano le modifiche e si scaricano i
#                    documenti nuovi (listini, esiti, aggiudicazioni, capitolati...), col testo dei PDF.
#
# Indirizzi provati dal vivo il 26/10/2026: rispondono tutti. Se una pagina non risponde per tre notti di fila arriva un'email:
# correggere qui l'indirizzo. Questo file sta in una sottocartella apposta, perché i *.toml della cartella
# delle convenzioni sono letti come convenzioni.

