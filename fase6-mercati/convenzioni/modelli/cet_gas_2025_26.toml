# Consorzio Energia Toscana (CET) – gas naturale anno termico 2025/26. MODELLO DA COMPLETARE.
# Prezzo mensile = spread fisso + PSV day-ahead del mese, riportato al PCS standard (stessa fonte ANCI Toscana).
# Indice PSV_DA: media mensile del PSV day-ahead pubblicata dall'ARERA (CMEM,m), scaricata in automatico
# ogni notte. Per un mese non ancora pubblicato il calcolo usa come stima il PSV del GME (PSV_GME_MENSILE). segnalandolo nelle note.

