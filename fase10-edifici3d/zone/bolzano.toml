url = "https://geoservices9.civis.bz.it/geoserver/ows?service=WCS&version=2.0.1&request=GetCoverage&coverageId=p_bz-Elevation__DigitalTerrainModel-2.5m&format=image/tiff&subset=E({x0},{x1})&subset=N({y0},{y1})"
