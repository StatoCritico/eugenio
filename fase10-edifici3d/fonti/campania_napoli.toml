# Zona «cam» per l'archivio di Napoli (08/11/2026, decisione di Paolo delle 15:22): sagome del DBT 2020 della Regione
# Campania (CC BY 4.0, adattatore campania_dbt) con le altezze del Copernicus Urban Atlas Building Height 2012
# (edifici3d/altezze_ua.py: classi di altezza a 10 m, 90° percentile per sagoma), poi la mediana dei vicini, poi la
# stima dall'uso; altezze OSM non usate (ODbL: mai nello stesso archivio CC BY). Stessa zona e cartella di campania.toml
# (cc-by/cam/napoli); qui cambia solo l'attribuzione, che cita anche Copernicus. Gli URL stanno qui, mai nel codice.

[zona]
nome = "Campania"
codice = "cam"
crs = "EPSG:25833"
riquadro = [13.7, 39.98, 15.82, 41.51]

[archivi]
"CC BY 4.0" = "cc-by"
"Copernicus 1159/2013" = "cc-by"         # sola citazione della fonte e dichiarazione delle modifiche: compatibile con CC BY
"ODbL 1.0" = "odbl"

[fonti.edifici]
