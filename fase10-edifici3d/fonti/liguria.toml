# Fonti della zona Liguria (fase 10, Fase E, adattatore del 05/11/2026). Gli URL stanno qui, mai nel codice.
# Verifiche dal vivo (container di sviluppo, nessun blocco aggirato):
# - 04/11/2026: WFS 2.0.0 GetCapabilities 200 (AccessConstraints e Fees NONE), scheda RNDT CC BY 4.0;
# - 05/11/2026: strati M2237:L8178 «Edificato» e M2237:L8177 «Manufatto edilizio»; L8178 in GeoJSON EPSG:3003
#   (Gauss-Boaga fuso Ovest), nessun campo di altezza, z costante per poligono in 399 su 400; nel punto del primo
#   edificio (x 1388611, y 4858157) la z vale 141,0 m e il DTM 2023 (WMS M2056, strato L6952, GetFeatureInfo) 137 m: la z
#   è la quota di gronda, altezza = z − DTM. Domini su 400 oggetti: def_sotterr «Non sotterraneo» 395 / «Sotterraneo» 5,
#   def_stato «In esercizio» 400, def_porz_est «Ingombro al suolo» 399 / «Aggetto» 1.
# - Il DTM serve: ritaglio del DTM 2023 (D.2056, CC BY 4.0) nel sistema della zona, passato con --dtm.
# - 08/11/2026 (gruppo C): archivio di prova di Genova (parziale, 4 tavole) con il DTM comunale 0,5 m; DSM − DTM contro
#   z − DTM: mediana −0,71 m, 77 % entro 2 m su 1.217 corpi (fonti.lidar qui sotto, edifici3d/altezze_dsm.py).

