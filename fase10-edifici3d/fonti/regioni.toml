# Fonti per regione (fase 10, Fase E, § 15 della proposta: «verifica regione per regione di DB topografici con altezze
# e ortofoto in CC BY»). Un blocco per regione o provincia autonoma, quattro temi:
#   edifici   DB topografico con sagome e, se c'è, altezza per corpo (unità volumetriche) o modello 3D
#   dtm       modello del terreno
#   dsm       modello delle superfici o nuvola LiDAR (altezze e falde dei tetti)
#   ortofoto  ortofoto a colori (solo RGB: l'infrarosso è sempre escluso)
#
# Campi di ogni [[regione.fonte]]:
#   tema, nome, licenza, stato, verifica (data), scheda (pagina o scheda RNDT), servizio (URL del servizio o del
#   download, se c'è), prova (esito della prova dal vivo), url_prova (URL che `python -m edifici3d regioni --prova`
#   ricontrolla), altezza (solo edifici: campo dell'altezza o «no»), motivo, usata_in (file di EuGEnio che la usano).
#
# Stati:
#   "attiva"          licenza aperta verificata e compatibile con la CC BY 4.0 di EuGEnio (CC BY 4.0, CC0, IODL 2.0,
#                     CC BY 3.0) scritta in una scheda ufficiale (RNDT o portale della Regione) E servizio o download
#                     provato dal vivo il giorno della verifica. Solo queste si possono accendere nei TOML di EuGEnio.
#   "in attesa"       il dato c'è ma manca qualcosa: licenza non scritta o «dato pubblico» senza licenza, accesso solo su
#                     richiesta, servizio non raggiungibile dal container di sviluppo (da riprovare dal server), oppure
#                     manca ancora l'adattatore del formato. Il motivo è scritto.
#   "non disponibile" nessun dato trovato, oppure licenza incompatibile (non commerciale, condivisione allo stesso modo,
#                     «tutti i diritti riservati», ortofoto AGEA concesse in licenza alla Regione).
#
# Metodo del 04/11/2026: ricerca nel catalogo nazionale RNDT (CSW di geodati.gov.it, schede ISO lette per licenza e
# collegamenti), siti delle Regioni, prove dal vivo dal container di sviluppo (GetCapabilities, GetMap in EPSG:3857,
# DescribeFeatureType, query ArcGIS, richieste di 1 kB sui download). **Nessun blocco aggirato**: dove un sito chiude la
# connessione, risponde 502/503 o chiede un captcha, la fonte resta «in attesa» con il motivo. Alcuni portali (Piemonte,
# Umbria, Calabria, Molise, Basilicata, Campania, Abruzzo, Marche) chiudono le connessioni dal container (fuori Italia):
# vanno riprovati dal server di Milano con `python -m edifici3d regioni --prova`.
#
# Fonti nazionali (valgono per tutte le regioni) in fondo, sotto [nazionale].

verificato = "2026-11-04"
licenze_compatibili = ["CC BY 4.0", "CC0 1.0", "IODL 2.0", "CC BY 3.0", "CC BY 2.5"]

