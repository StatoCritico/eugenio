# Fonti della zona Friuli Venezia Giulia (fase 10, Fase E, adattatore del 05/11/2026). Gli URL stanno qui, mai nel codice.
# Verifiche dal vivo (container di sviluppo, nessun blocco aggirato):
# - 04/11/2026: WFS 2.0.0 GetCapabilities 200, AccessConstraints e Fees NONE, CC BY 4.0 nella scheda del servizio di
#   download (le schede dei singoli strati dicono «Non indicato»: annotato in fonti/regioni.toml);
# - 05/11/2026: 44 strati, uno per foglio CTRN (EDIFICI:EDIFICATO_CTRN_ED1_018 … _ED2_…); GetFeature di 6 elementi del
#   foglio 110 in GeoJSON EPSG:6708 (RDN2008 / UTM 33N): ALTEZZA, QUOTA_PIEDE, QUOTA_GRONDA, VOLUME, AREA, CODICE, NOME, ID;
#   QUOTA_GRONDA − QUOTA_PIEDE = ALTEZZA in 6 su 6. Nessun identificativo d'edificio: ogni elemento è un corpo.

[zona]
