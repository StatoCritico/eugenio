# Testi delle schede della pagina iniziale (index.html, 22/11/2026). costruisci_pagine.py prende le voci dal menu
# (parti/testata.html: ordine, nome, stato) e da qui il titolo del gruppo nel disegno, la descrizione del gruppo e una
# riga per pagina. Una pagina nuova nel menu compare da sola nella scheda; la sua riga va aggiunta qui sotto (la prova
# test_pagina_iniziale controlla che ogni pagina accessibile ne abbia una).

[gruppi.clima]
parte = "il cielo e il meteo"
descrizione = "Il clima osservato e quello previsto, comune per comune: gradi giorno, temperature, pioggia, dati da scaricare e da ricevere per email."

[gruppi.patrimonio]
parte = "il territorio intorno"
descrizione = "Gli edifici sulla mappa con il catasto, le foto aeree e il 3D: dal tuo elenco di sedi agli immobili pubblici di tutta Italia."

[gruppi.edificio]
parte = "l'edificio"
descrizione = "Cosa chiede la legge all'edificio, com'è fatto e quanto consuma: geometria, firma energetica, priorità tra le sedi."

[gruppi.aria]
parte = "l'impianto dell'aria sul tetto"
descrizione = "La psicrometria per le unità di trattamento aria, dal clima ora per ora del comune: trasformazioni, ore, carichi latenti, free cooling."

[gruppi.cogenerazione]
parte = "il cogeneratore"
descrizione = "Produrre elettricità e calore sul posto: convenienza, emissioni e rischio prezzo. Pagine in preparazione."

[gruppi.fotovoltaico]
parte = "i pannelli fotovoltaici"
descrizione = "Il sole sui tetti e la rete che riceve l'energia: cabine primarie e aree del GSE per le comunità energetiche, ombre e producibilità."

[gruppi.statistiche]
parte = "le reti e i mercati"
descrizione = "I numeri dell'energia in Italia: prezzi, produzione e consumi di elettricità, carichi, stato della rete, suolo, costi della sanità."

