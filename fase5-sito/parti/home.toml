# Parti del disegno (parti/scena_home.html, di Claude Design; 16 parti: la cabina primaria sta nel traliccio): titolo e descrizione nel riquadretto, pagine collegate (anche di altri
# gruppi, anche in lavorazione). Il clic apre la scheda del gruppo («gruppo») con queste pagine in evidenza. Una parte
# senza pagine accessibili è «prossimamente» (lo calcola costruisci_pagine.py dal menu). I titoli riportano gli argomenti
# del menu, non gli oggetti del disegno (23/11/2026, Paolo: niente «sul tetto», «sulla torre»…).
[parti.meteo]
gruppo = "clima"
titolo = "Previsioni e dati climatici"
descrizione = "Temperature, gradi giorno e previsioni del comune: per le previsioni dei consumi, i dati climatici e gli avvisi per email."
pagine = ["previsioni.html", "legge10.html", "dati.html", "edificio-clima.html", "dati-per-email.html"]

[parti.stazione-meteo]
