<style>
/* ---- pagina iniziale: scena statica a tutta finestra (23/11/2026) ---- */
#scena-contenitore{height:auto!important;aspect-ratio:auto!important;overflow:visible!important;max-width:none!important;border:0!important;border-radius:0!important}
.sh{position:relative;left:var(--sh-x,0px);width:var(--sh-w,100%);margin:0 0 1rem;container-type:inline-size;
  --sh-acc:#5ee1ff;--sh-poi:#ffb020;--sh-fondo:rgba(8,12,18,.92);--sh-testo:#eaf6fb;--sh-tenue:#9fb7c4;--sh-bordo:rgba(94,225,255,.55)}
[data-theme="light"] .sh{--sh-acc:#c2410c;--sh-poi:#6b7280;--sh-fondo:rgba(255,255,255,.96);--sh-testo:#1d2a33;--sh-tenue:#4a5761;--sh-bordo:#1d2a33}
.sh-quadro{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#0b0d10}
[data-theme="light"] .sh-quadro{background:#eceee9}
.sh-fondo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.sh-fondo-chiaro{display:none}
[data-theme="light"] .sh-fondo-scuro{display:none}
[data-theme="light"] .sh-fondo-chiaro{display:block}
/* bersagli: gli unici elementi attivi */
.sh-punto{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,3.4cqw,46px);height:clamp(30px,3.4cqw,46px);
  padding:0;border:0;background:none;cursor:pointer;color:var(--sh-acc);border-radius:50%;z-index:2}
.sh-punto.sh-poi{color:var(--sh-poi)}
.sh-mira{width:100%;height:100%;display:block;overflow:visible}
.sh-mira circle{fill:var(--sh-fondo);stroke:currentColor;stroke-width:2.2}
.sh-mira path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.sh-poi .sh-mira circle{stroke-dasharray:4 3}
.sh-punto:hover .sh-mira circle,.sh-punto:focus-visible .sh-mira circle,.sh-punto[aria-expanded="true"] .sh-mira circle{fill:currentColor}
.sh-punto:hover .sh-croce,.sh-punto:focus-visible .sh-croce,.sh-punto[aria-expanded="true"] .sh-croce{stroke:var(--sh-fondo)}
.sh-punto:focus-visible{outline:2px solid var(--sh-acc);outline-offset:3px}
.sh-titolo{position:absolute;left:calc(100% + 6px);top:50%;transform:translate(var(--dx,0px),-50%);white-space:nowrap;pointer-events:none;
  font:600 clamp(14px,1.43cqw,19.5px)/1.2 system-ui,sans-serif;color:var(--sh-testo);background:var(--sh-fondo);
  border:1px solid var(--sh-bordo);border-radius:4px;padding:3px 8px;opacity:0;visibility:hidden}
.sh-sx .sh-titolo{left:auto;right:calc(100% + 6px)}
.sh-punto.sh-acceso .sh-titolo{opacity:1;visibility:visible}
/* (24/11/2026, Paolo) bersaglio del file per gli LLM in cima al fascio di luce dietro la torre: verde per attirare
   l'attenzione; è un collegamento diretto al file, senza scheda */

.sh-punto.sh-file{color:var(--sh-llm)}
.sh-punto.sh-file .sh-titolo{border-color:var(--sh-llm)}
.sh-punto.sh-file:focus-visible{outline-color:var(--sh-llm)}
/* descrizione breve (sostando sul bersaglio) e scheda flottante (clic) */
.sh-descr,.sh-scheda{position:absolute;z-index:4;background:var(--sh-fondo);color:var(--sh-testo);border:1px solid var(--sh-bordo);

.sh-descr{width:min(320px,72cqw);padding:10px 12px;pointer-events:none}
.sh-descr strong{display:block;font-size:1.05em;margin-bottom:2px}
.sh-descr .sh-nota{display:block;margin-top:6px;font-size:.85em;color:var(--sh-acc)}
.sh-scheda{width:min(380px,92cqw);max-height:calc(100% - 24px);overflow:auto;padding:14px 16px 12px}
.sh-scheda h2{margin:0 28px 4px 0;font-size:1.15em;line-height:1.25}
.sh-scheda .sh-gruppo{margin:0 0 4px;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--sh-acc)}
.sh-scheda p{margin:0 0 10px;color:var(--sh-tenue)}
.sh-scheda ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sh-scheda li a,.sh-scheda li .sh-spenta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 10px;
  border-radius:4px;text-decoration:none;color:var(--sh-testo);border:1px solid transparent;min-height:44px;box-sizing:border-box}
.sh-scheda li a{border-color:var(--sh-bordo)}
.sh-scheda li a:hover,.sh-scheda li a:focus-visible{background:var(--sh-acc);color:var(--sh-fondo);outline:none}
.sh-scheda li .sh-spenta{color:var(--sh-tenue);cursor:default}
.sh-scheda .sh-stato{font-size:.78em;white-space:nowrap;opacity:.85}
.sh-scheda .sh-vuota{color:var(--sh-tenue);font-style:italic}
.sh-chiudi{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:4px;background:none;color:var(--sh-testo);

.sh-chiudi:hover,.sh-chiudi:focus-visible{background:var(--sh-acc);color:var(--sh-fondo)}
.sh-tutte{display:inline-block;margin-top:10px;font-size:.9em;color:var(--sh-acc)}
/* legenda del consumo di suolo */

.sh-scala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:8px;margin:6px 0 3px}
.sh-tacche{display:flex;justify-content:space-between;opacity:.8}

[data-theme="light"] .sh-scala i:nth-child(3){background:#f1dc86}[data-theme="light"] .sh-scala i:nth-child(4){background:#eea25a}
[data-theme="light"] .sh-scala i:nth-child(5){background:#d6553a}
@container (max-width:560px){.sh-legenda{display:none}.sh-scheda{position:fixed;left:8px!important;right:8px;width:auto;top:auto!important;bottom:8px;max-height:70vh}}
</style>
