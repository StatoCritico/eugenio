# Novità di EuGEnio: le funzioni per gli utenti, pubblicazione per pubblicazione (fonte unica, dal 07/11/2026).
#
# Una voce [[voce]] per ogni pubblicazione **con qualcosa di nuovo per chi usa il servizio**, la più recente in cima.
# costruisci_pagine.py ne genera la pagina sito/novita.html e il feed Atom sito/novita.xml (python costruisci_pagine.py;
# --controlla dice se sono da rifare); la newsletter mensile ne prende le voci del mese. La prima voce deve avere la
# versione di sito/index.html (tests/test_costruisci_pagine.py).
#
# Campi: data (aaaa-mm-gg), versione (quella di ?v=…), titolo; poi, tutti facoltativi:
#   nuovo       servizi pubblicati: pagine o funzioni nuove che si possono usare
#   migliorato  cosa si può fare di più o meglio in un servizio che c'era già (anche «ora funziona X» se prima un difetto
#               si vedeva davvero)
#   verificato  servizi passati da sperimentali a validati
#   testo       un paragrafo semplice (una voce con il solo testo può non avere la versione: «Meet EuGEnio», 26/10/2026)
#   collegamenti { testo, indirizzo } (pagina del sito, articolo, release su GitHub)
# Decisione di Paolo dell'08/11/2026: solo lo sviluppo delle funzioni per gli utenti. **Niente modifiche interne**
# (protezione e verifica anti-robot, menu, file per gli agenti AI, copie e versioni, server, test, licenze tecniche).
# Linguaggio semplice, frasi brevi, il nome della pagina con il gruppo del menu («Patrimonio › Modelli 3D»), niente gergo.
# Una pubblicazione senza novità per gli utenti non ha voce (la sua sostanza, se c'è, va nella voce successiva).
# Regola permanente: a ogni pubblicazione una voce qui, insieme ad AGGIORNAMENTO_<data>.md, EUGENIO_PER_AGENTI.md e
# llms.txt, e la release su GitHub con lo stesso testo (tag v<aaaa>.<mm>.<gg>).
# Mai dati di mercato GME o EEX, mai la fase 2, mai il modulo privato delle norme UNI.

