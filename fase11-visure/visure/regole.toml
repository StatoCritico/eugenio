# Regole di riconoscimento delle visure catastali (EuGEnio Visure, fase 11).
#
# Si adattano qui, senza toccare il codice: ogni voce è un elenco di espressioni regolari (sintassi di Python, senza
# distinzione tra maiuscole e minuscole) provate nell'ordine; vince la prima che trova qualcosa. Il primo gruppo tra
# parentesi è il valore. Con `python -m visure leggi … --regole mie.toml` un file proprio sostituisce solo le voci che
# contiene (le altre restano queste).
#
# Le visure vere non sono ancora arrivate (servono visure anonimizzate): queste regole sono scritte sul modello delle
# visure di SISTER e dell'area riservata (formato «attuale» a campi con etichetta e formato «a tabella») e provate sui
# PDF sintetici dei test. Quando arrivano le visure vere si aggiungono qui le varianti che mancano.

[documento]
# tipo di visura
per_soggetto = ['visura\s+(?:attuale\s+|storica\s+)?per\s+soggetto', 'elenco\s+immobili\s+per\s+soggetto']
per_immobile = ['visura\s+(?:attuale\s+|storica\s+)?per\s+immobile', 'visura\s+per\s+immobile']
storica = ['visura\s+storica']
data = ['data:?\s*(\d{1,2}/\d{1,2}/\d{4})', 'situazione\s+degli\s+atti\s+informatizzati\s+(?:dall.impianto\s+meccanografico\s+)?al\s+(\d{1,2}/\d{1,2}/\d{4})', '(\d{1,2}/\d{1,2}/\d{4})']
# testo che deve esserci perché il documento sia una visura (almeno una)
riconoscimento = ['catasto\s+(?:dei\s+)?fabbricati', 'catasto\s+(?:dei\s+)?terreni', 'visura', 'dati\s+(?:di\s+)?classamento']

[comune]
# «Comune di RAVENNA (H199)», «Comune di RAVENNA ( Codice: H199)», «Comune di RAVENNA(Codice H199)»
nome_codice = ['''comune\s+di\s+([A-ZÀ-Ý'’. -]+?)\s*\(\s*(?:codice:?\s*)?([A-Z]\d{3})\s*\)''', '''comune:?\s+([A-ZÀ-Ý'’. -]+?)\s*[-–(]\s*(?:codice:?\s*)?([A-Z]\d{3})\b''']

[blocchi]
# inizio di un'unità nel formato «attuale» (campi con etichetta)
inizio = ['^\s*immobile\s+n\.?\s*\d+\b', '^\s*unit[aà]\s+immobiliare\s+n\.?\s*\d+\b', '^\s*immobile\s+\d+\s*:', '^\s*particella\s+n\.?\s*\d+\b']
# tipo di catasto del blocco
fabbricati = ['catasto\s+(?:dei\s+)?fabbricati', '\bfabbricati\b', 'categoria\s+[A-F]\s?/']
terreni = ['catasto\s+(?:dei\s+)?terreni', '\bterreni\b', 'qualit[aà]', 'reddit[oi]\s+dominical']

[campi]
# formato «attuale»: campi con etichetta dentro il blocco dell'unità
sezione = ['sezione\s+urbana:?\s+([A-Z0-9]{1,3})\b(?!\s*-)', 'sez(?:ione)?\.?:?\s+([A-Z]{1,3})\s+foglio']
foglio = ['foglio:?\s*([0-9]{1,4}[A-Z]?)\b']
particella = ['\b(?:particella|mappale):?\s*([0-9]{1,6}(?:/[0-9A-Z]{1,4})?)\b']
subalterno = ['\bsub(?:alterno|\.)?:?\s*([0-9]{1,4})\b']
zona_censuaria = ['zona\s+(?:censuaria|cens\.?):?\s*([0-9A-Z]{1,3})\b']
microzona = ['micro\s*zona:?\s*([0-9]{1,3})\b']
categoria = ['categoria:?\s*([A-F]\s?/\s?[0-9]{1,2})', '\bcat\.?:?\s*([A-F]\s?/\s?[0-9]{1,2})']
classe = ['classe:?\s*([0-9]{1,2}|U)\b']
consistenza = ['consistenza:?\s*([0-9][0-9.,]*)\s*(vani|m²|m2|mq|m³|m3|mc)']
superficie_totale = ['superficie\s+catastale:?\s*(?:totale:?\s*)?([0-9][0-9.,]*)\s*(?:m²|m2|mq)', 'totale:?\s*([0-9][0-9.,]*)\s*(?:m²|m2|mq)']
superficie_escluse = ['escluse\s+aree\s+scoperte\W{0,6}(?:[a-z]\)\s*)?:?\s*([0-9][0-9.,]*)\s*(?:m²|m2|mq)']
rendita = ['rendita:?\s*(?:euro|€)\s*([0-9][0-9.,]*)', 'rendita\s+catastale:?\s*(?:euro|€)?\s*([0-9][0-9.,]*)']
indirizzo = ['''indirizzo:?\s+(.+?)(?=\s+pian[oi]:?\s+(?:da\s+\d|(?:S\d|S|PT|T|R|\d{1,2}°?|terra|rialzato|seminterrato|interrato|ammezzato|sottotetto|mansarda)(?![\w°]))|\s*;|\s*$)''', '''ubicazione:?\s+(.+?)(?=\s+pian[oi]:?\s+(?:da\s+\d|(?:S\d|S|PT|T|R|\d{1,2}°?|terra|rialzato|seminterrato|interrato|ammezzato|sottotetto|mansarda)(?![\w°]))|\s*;|\s*$)''']
piano = ['''\bpian[oi]:?\s+((?:da\s+\d{1,2}\s+a\s+\d{1,2})|(?:S\d|S|PT|T|R|\d{1,2}°?|terra|rialzato|seminterrato|interrato|ammezzato|sottotetto|mansarda)(?:\s*[-/,]\s*(?:S\d|S|PT|T|R|\d{1,2}°?|terra|rialzato|seminterrato|interrato|ammezzato|sottotetto|mansarda))*)(?![\w°])''']
# terreni
qualita = ['qualit[aà](?:\s+classe)?:?\s*([A-Z][A-Z ]+?)(?:\s+di)?\s+classe\s*([0-9]{1,2}|U)\b', 'qualit[aà]:?\s*([A-Z][A-Z ]+?)\s*(?:$|\s{2,})']
superficie_ha = ['superficie(?:\s*\(?ha\s+are\s+ca\)?)?:?\s*([0-9]{1,4})\s*[. ]\s*([0-9]{2})\s*[. ]\s*([0-9]{2})\b(?!\s*m)', 'ha\s*([0-9]{1,4})\s+are\s*([0-9]{1,2})\s+ca\s*([0-9]{1,2})']
superficie_m2 = ['superficie:?\s*([0-9][0-9.,]*)\s*(?:m²|m2|mq)']
reddito_dominicale = ['dominicale:?\s*(?:euro|€)\s*([0-9][0-9.,]*)']
reddito_agrario = ['agrario:?\s*(?:euro|€)\s*([0-9][0-9.,]*)']

[tabella]
# formato «a tabella»: riga dei titoli e nomi delle colonne. Le celle si assegnano alla colonna con il titolo più vicino.
titoli_fabbricati = ['\bfoglio\b.*\bparticella\b.*\bcategoria\b', '\bfoglio\b.*\bmappale\b.*\bcategoria\b']
titoli_terreni = ['\bfoglio\b.*\bparticella\b.*\bqualit']
# colonna → parole del titolo (minuscole)
[tabella.colonne]
n = ['n.', 'n', 'num.']
sezione = ['sezione', 'sez.', 'sez']
foglio = ['foglio']
particella = ['particella', 'mappale', 'numero']
subalterno = ['sub', 'sub.', 'subalterno']
zona_censuaria = ['zona']
microzona = ['micro', 'microzona']
categoria = ['categoria', 'cat.']
classe = ['classe']
consistenza = ['consistenza']
superficie = ['superficie']
rendita = ['rendita']
indirizzo = ['indirizzo', 'ubicazione']
porzione = ['porz', 'porz.']
qualita = ['qualità', 'qualita', 'qualità classe']
deduzioni = ['deduz', 'deduz.', 'deduzioni']
reddito_dominicale = ['dominicale', 'reddito dominicale']
reddito_agrario = ['agrario', 'reddito agrario']
superficie_ha = ['ha are ca', 'superficie (ha are ca)', 'superficie ha are ca']
dati_derivanti = ['dati derivanti da', 'dati', 'derivanti']

[personali]
# righe che contengono dati personali: non entrano mai nei campi delle unità; con --includi-intestatari si leggono a
# parte (file intestatari_DATI_PERSONALI.csv). Servono anche al controllo di anonimato (comando `controlla`).
sezione = ['^\s*intestat[oi]\b', '^\s*intestazione\b', '^\s*dati\s+anagrafici', '^\s*soggetto:?\s']
codice_fiscale = ['\b([A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z])\b', '\b([0-9]{11})\b']
nascita = ['\bnat[oa]\s+a\s+[A-Z]', '\bnat[oa]\s+il\s+\d']
diritto = ['propriet[aà]\W?\s*per\s+\d+/\d+', 'diritto\s+di:?\s', 'usufrutto', 'nuda\s+propriet']
